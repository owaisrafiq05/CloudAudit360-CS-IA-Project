{% extends "base.html" %}
{% block title %}Login — CloudAudit360{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="card w-full max-w-md p-8">
    <h1 class="text-2xl font-semibold mb-1">Sign in</h1>
    <p class="text-sm text-gray-400 mb-6">Cloud Security audits &amp; GRC assurance workspace</p>
    {% if error %}
    <div class="mb-4 text-sm text-red-300">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-300 mb-1">Username</label>
        <input name="username" class="w-full rounded-md bg-ink-950 border border-gray-700 px-3 py-2 focus:outline-none focus:border-sea-600" required />
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Password</label>
        <input type="password" name="password" class="w-full rounded-md bg-ink-950 border border-gray-700 px-3 py-2 focus:outline-none focus:border-sea-600" required />
      </div>
      <button class="w-full rounded-md bg-sea-600 hover:bg-sea-500 text-white font-medium py-2.5">Continue</button>
    </form>
    <p class="mt-6 text-xs text-gray-500">Demo: admin / admin123 · auditor / auditor123 · viewer / viewer123</p>
  </div>
</div>
{% endblock %}
